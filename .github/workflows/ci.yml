name: CI

on:
  push:
    branches: [master, mac-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The macOS port is experimental: its job reports but does not turn the whole run (and the README badge) red.
    # Flip this to `false` once the mac job is green.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "$RUNNER_OS" = "macOS" ] && [ -f requirements-mac.txt ]; then
            pip install -r requirements-mac.txt
          fi

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v

      # Environment + geometry + detection, no window. A backend that cannot even be imported fails this step.
      - name: doctor --headless
        if: ${{ always() }}
        shell: bash
        run: python minis.py doctor --headless

      # The runner has a GUI session: try real windows. Reported, not (yet) gating: a runner without a window server says so.
      - name: macOS doctor with a real test window (informational)
        if: ${{ always() && runner.os == 'macOS' }}
        continue-on-error: true
        shell: bash
        run: python minis.py doctor

      - name: macOS selftest-gui (informational)
        if: ${{ always() && runner.os == 'macOS' }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: python minis.py selftest-gui

  # Real slot + arena PROCESSES talking over the real bus / control / arena.json files in a temp data dir
  # (tests/test_integration_processes.py, ~3 min). The harness overlays are headless, so no window is needed for the
  # suite itself; the doctor step shows whether this runner can also open a real test window. Blocking.
  integration:
    name: integration (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: doctor with a real test window (informational)
        continue-on-error: true
        shell: bash
        run: python minis.py doctor

      - name: Process-level integration suite
        shell: bash
        run: MINIS_INTEGRATION=1 python -m unittest tests.test_integration_processes -v

  package:
    name: package smoke test (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel carries the code and the art (inside the package, never top-level assets/)
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ['minis.py', 'minis_core/atlas.py', 'minis_core/paths.py', 'minis_platform/__init__.py', 'minis_mac/shell.py',
                  'minis_win/shell.py', 'taskbar_fighters_assets/__init__.py', 'taskbar_fighters_assets/assets/icon/minis.ico',
                  'taskbar_fighters_assets/assets/claude/anim.json', 'taskbar_fighters_assets/assets_hd/claude/sheet.png']
          missing = [n for n in need if n not in names]
          assert not missing, f'missing from {whl}: {missing}'
          stray = [n for n in names if n.startswith(('assets/', 'assets_hd/', 'tests/'))]
          assert not stray, f'top-level data in {whl}: {stray[:5]}'
          print(f'{whl}: {len(names)} files, ok')
          EOF
      - name: Install the wheel and read the art from the installed copy
        run: |
          python -m venv /tmp/tfv
          /tmp/tfv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/tfv/bin/taskbar-fighters --help > /dev/null
          /tmp/tfv/bin/python - <<'EOF'
          from minis_core import paths
          root = paths.bundle_root()
          assert 'site-packages' in str(root) and root.name == 'taskbar_fighters_assets', root
          n = sum(1 for p in paths.assets_dir().iterdir() if (p / 'anim.json').is_file())
          assert n == 13, n
          print('installed art:', root, n, 'characters')
          EOF
