[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskbar-fighters"
version = "1.0.0"
description = "Pixel-art fighters for your AI coding agents (Claude Code, Codex, Gemini, Cursor, Ollama...), living in your taskbar and battling from real usage."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Sierra" }]
keywords = ["claude", "codex", "ai-agents", "pixel-art", "taskbar", "windows", "macos", "game", "desktop-pet"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development",
]
dependencies = ["Pillow>=9.1"]

[project.optional-dependencies]
# macOS backend (AppKit / Quartz through PyObjC).  Same pins as requirements-mac.txt; the marker keeps a Windows
# `pip install "taskbar-fighters[mac]"` from pulling PyObjC.
mac = [
    "pyobjc-core>=11.1,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.1,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.1,<13; sys_platform == 'darwin'",
]

[project.scripts]
taskbar-fighters = "minis:main"

[project.urls]
Homepage = "https://github.com/mrktchris/taskbar-fighters"
Source = "https://github.com/mrktchris/taskbar-fighters"
Issues = "https://github.com/mrktchris/taskbar-fighters/issues"
Changelog = "https://github.com/mrktchris/taskbar-fighters/blob/master/CHANGELOG.md"

[tool.setuptools]
py-modules = ["minis"]
include-package-data = false
# The art lives at the repo root (assets/, assets_hd/) and installs INSIDE the package taskbar_fighters_assets, never
# as top-level site-packages/assets.  minis_core/paths.py resolves checkout, PyInstaller, py2app and wheel alike.
packages = [
    "minis_core",
    "minis_win",
    "minis_mac",
    "minis_platform",
    "taskbar_fighters_assets",
    "taskbar_fighters_assets.assets",
    "taskbar_fighters_assets.assets_hd",
]

[tool.setuptools.package-dir]
"taskbar_fighters_assets.assets" = "assets"
"taskbar_fighters_assets.assets_hd" = "assets_hd"

[tool.setuptools.package-data]
"taskbar_fighters_assets.assets" = ["**/*.png", "**/*.json", "**/*.ico", "**/*.wav"]
"taskbar_fighters_assets.assets_hd" = ["**/*.png", "**/*.json"]
